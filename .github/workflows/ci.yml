name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Check card JavaScript
        shell: bash
        run: node --check custom_components/vasttrafik_timetable/www/vasttrafik-timetable-card.js