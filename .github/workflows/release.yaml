name: Release

# The release version comes from git tags. manifest.json on master keeps the
# placeholder version 0.0.0; the real version is written into manifest.json
# only inside the release archive, so nothing is committed to master.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        required: true
        default: Patch
        options:
          - Patch
          - Minor
          - Major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          LATEST="$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | head -n 1 || true)"
          CURRENT="${LATEST#v}"
          CURRENT="${CURRENT:-0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            Major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            Minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            Patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown version increment: '$BUMP'" >&2; exit 1 ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Release tag v$VERSION already exists" >&2
            exit 1
          fi
          echo "Bumping ${LATEST:-<none>} -> v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package integration
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          FILENAME="$(jq -r '.filename // empty' hacs.json)"
          if [[ -z "$FILENAME" || "$FILENAME" != *.zip ]]; then
            echo "hacs.json must define a .zip filename" >&2
            exit 1
          fi
          MANIFEST=custom_components/vasttrafik_timetable/manifest.json
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" "$MANIFEST"
          (
            cd custom_components/vasttrafik_timetable
            zip -q -r "$GITHUB_WORKSPACE/$FILENAME" .
          )
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILENAME: ${{ steps.package.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$FILENAME" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes