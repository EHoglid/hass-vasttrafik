services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: vasttrafik-ha
    restart: unless-stopped
    ports:
      - "8123:8123" # Home Assistant UI
      - "5678:5678" # debugpy remote debugger
    volumes:
      - ./dev-config:/config
      # Live-mount the integration so edits show up on HA restart (no rebuild).
      - ./custom_components/vasttrafik_timetable:/config/custom_components/vasttrafik_timetable
    environment:
      - TZ=Europe/Stockholm
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/manifest.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
